<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alta de tablet · Bitácora Ambulancia HF</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icons/ambulancia.svg" type="image/svg+xml">
<style>
body{margin:0;font:17px/1.5 Roboto,Arial,sans-serif;background:#F2F5F9;color:#001C41}
.bar{display:flex;height:8px}.bar i{display:block}.a{width:33%;background:#0F69C4}.b{flex:1;background:#EB3C46}
main{max-width:560px;margin:0 auto;padding:16px;text-align:center}
#qr svg{width:min(80vw,360px);height:auto;background:#fff;padding:12px;border-radius:8px}
code{word-break:break-all;background:#fff;border:1px solid #9DB4D2;border-radius:6px;padding:8px;display:block;font-size:14px}
.aviso{background:#FFF4D6;border:2px solid #E2C15E;border-radius:6px;padding:10px;text-align:left}
</style></head><body>
<div class="bar"><i class="a"></i><i class="b"></i></div>
<main>
<p>Servicio de Salud del Reloncaví · Hospital de Frutillar</p>
<h1 style="font-size:24px">Alta de tablet · Bitácora de Ambulancia</h1>
<div id="contenido"><p>Esta página muestra el código QR de alta de una tablet. Ábrala con el enlace que entrega <b>ADMIN_crearToken</b> en el editor de Apps Script.</p></div>
</main>
<script src="vendor/qrcode.js"></script>
<script>
/* El token llega en el "#" de la dirección: el navegador no lo envía a ningún servidor y el QR se dibuja aquí mismo. */
(function () {
  var m = /(?:^#|&)t=([A-Za-z0-9_-]{20,128})/.exec(location.hash || '');
  if (!m) return;
  history.replaceState(null, '', location.pathname);
  var enlace = new URL('./', location.href).href + '#t=' + m[1];
  var qr = qrcode(0, 'M'); qr.addData(enlace); qr.make();
  document.getElementById('contenido').innerHTML =
    '<p>Con la tablet: abra la <b>cámara</b>, apunte a este código y toque el enlace. La bitácora queda configurada.</p>' +
    '<div id="qr">' + qr.createSvgTag({ cellSize: 6, margin: 2, scalable: true }) + '</div>' +
    '<p>Si no puede escanear, pegue este token en la pantalla "Configurar esta tablet":</p><code id="tok"></code>' +
    '<p class="aviso">Este código da acceso para registrar en la planilla. No lo envíe por WhatsApp ni correo y cierre esta página al terminar. Si se filtra, revóquelo con ADMIN_revocarToken.</p>';
  document.getElementById('tok').textContent = m[1];
})();
</script>
</body></html>
